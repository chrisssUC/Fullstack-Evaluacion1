<main>

    <h2>Contacto</h2>

    <form class="contact-form" id="formContacto">

        <label for="nombreContacto">Nombre:</label>
        <br>

        <input type="text" id="nombreContacto">

        <p id="errorNombreContacto"></p>


        <label for="correoContacto">Correo:</label>
        <br>

        <input type="text" id="correoContacto">

        <p id="errorCorreoContacto"></p>


        <label for="comentario">Comentario:</label>
        <br>

        <textarea id="comentario" rows="6"></textarea>

        <p id="errorComentario"></p>


        <button type="submit">
            Enviar mensaje
        </button>

    </form>

</main>


<footer>

    <p>SaborCasero - Restaurante de comida chilena</p>
